name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: lms

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: lms/package-lock.json
      - run: npm ci
      - run: npm run audit:source
      - run: npm run audit:contract
      - run: npm run lint:ci
      - run: npm run typecheck
      - run: npm run typecheck:production
      - run: npm run test:run
      - run: npm run build:release
        env:
          VITE_GIT_SHA: ${{ github.sha }}
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CI: true
      - uses: actions/upload-artifact@v4
        with:
          name: coursistant-frontend-${{ github.sha }}
          path: lms/dist
          if-no-files-found: error
          retention-days: 30
